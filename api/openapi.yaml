  /oidc/authorize:
    get:
      operationId: oidcAuthorize
      parameters:
      - description: registered client id
        in: query
        name: client_id
        required: false
        schema:
          type: string
      - description: must match one registered for the client
        in: query
        name: redirect_uri
        required: false
        schema:
          type: string
      - description: code
        in: query
        name: response_type
        required: false
        schema:
          type: string
      - description: openid plus any extra scopes
        in: query
        name: scope
        required: false
        schema:
          type: string
      - description: opaque value echoed back to the client
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: bound into the id_token
        in: query
        name: nonce
        required: false
        schema:
          type: string
      - description: PKCE challenge (required for public clients)
        in: query
        name: code_challenge
        required: false
        schema:
          type: string
      - description: S256 (plain is refused for public clients)
        in: query
        name: code_challenge_method
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Hosted login page (NCALayer widget, plus the eGov QR option
            when the QR orchestrator is on)
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Client or redirect_uri rejected — rendered here rather than
            redirected
      summary: 'Authorization endpoint: renders the hosted login page that collects
        a signature (authorization code + PKCE)'
      tags:
      - oidc
    post:
      operationId: oidcAuthorizeSubmit
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              description: The authorize parameters as posted back by the login page,
                plus the collected signature.
              properties:
                challengeId:
                  description: id of the challenge the page was issued
                  type: string
                client_id:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                nonce:
                  type: string
                redirect_uri:
                  type: string
                response_type:
                  type: string
                scope:
                  type: string
                signature:
                  description: detached CMS over the challenge nonce
                  type: string
                state:
                  type: string
              required:
              - challengeId
              - signature
              type: object
        required: true
      responses:
        "303":
          description: Redirect to redirect_uri with code and state
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Authorization refused (bad client, redirect_uri or signature)
      summary: Submit the collected signature and redirect back to the relying party
        with an authorization code
      tags:
      - oidc

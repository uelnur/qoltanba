        in: query
        name: stream
        required: false
        schema:
          enum:
          - "1"
          - "true"
          - "yes"
          type: string
      - description: application/x-ndjson streams per-item results as they complete
        in: header
        name: Accept
        required: false
        schema:
          type: string
      - description: preferred language for error messages (ru, kk; anything else
          renders English)
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: replay the first successful response for this key instead of
          re-executing, so a retry does not produce a second signature
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractBatchRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractBatchResponse'
